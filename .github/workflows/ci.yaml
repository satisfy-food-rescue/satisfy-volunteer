name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Lint, types and schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --max-warnings 0
      - run: pnpm typecheck
      - run: pnpm exec prisma validate
      - run: pnpm exec prisma format --check
      - run: pnpm test

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/satisfy_test
      # The migration must match the schema: fails if a schema change has no migration.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/satisfy_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
      - name: Migrations match the schema
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  mobile:
    name: Native app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Types, including every route href
        run: |
          pnpm typegen
          pnpm typecheck
      - run: pnpm test
      - name: Dependencies match the Expo SDK
        run: pnpm exec expo install --check
      # Proves the app bundles for both platforms, the step a store build or OTA update starts with.
      - name: Bundle for iOS and Android
        run: pnpm exec expo export --platform ios --platform android --output-dir dist

  web:
    name: End-to-end and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/satisfy_e2e
      E2E_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The build needs no environment: everything is read at runtime.
      - run: pnpm build
      # Real sign-in: password, sign-in links and passkeys, as production runs.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      # Every page as every persona, and every native app endpoint, on a demo
      # server: the path a demo deployment takes (migrate, then seed on boot).
      - name: Start a demo server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/satisfy_demo
          DEMO_MODE: "1"
          NODE_ENV: production
          PORT: "3100"
        run: |
          pnpm exec prisma migrate deploy
          pnpm start > server.log 2>&1 &
          curl --silent --show-error --fail --output /dev/null \
            --retry 90 --retry-delay 1 --retry-all-errors http://localhost:3100/api/health/ready
      - name: Smoke test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/satisfy_demo
          BASE_URL: http://localhost:3100
        run: pnpm test:smoke
      - name: Server log
        if: ${{ !cancelled() }}
        run: cat server.log

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: satisfy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: satisfy-volunteer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Boots the image as a first production deploy would: an empty database,
      # migrations on start, reference data and the first admin from bootstrap.
      - name: Boot the image
        run: |
          docker run --detach --name app --network host \
            --env DATABASE_URL=postgresql://postgres:postgres@localhost:5432/satisfy \
            --env APP_URL=http://localhost:3000 \
            --env EMAIL_DELIVERY=log \
            --env CRON_SECRET=ci-cron-secret \
            --env BOOTSTRAP_ADMIN_EMAIL=coordinator@example.org \
            satisfy-volunteer:ci
          curl --silent --show-error --fail --output /dev/null \
            --retry 120 --retry-delay 1 --retry-all-errors http://localhost:3000/api/health/ready
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/app)
          test "$status" = 307 || { echo "Expected /app to redirect to sign-in, got $status"; exit 1; }
          curl --silent --show-error --fail --output /dev/null http://localhost:3000/sign-in
          docker exec app node scripts/cron-tick.mjs
          docker logs app 2>&1 | grep -q "\[bootstrap\] created admin coordinator@example.org"
      - name: Container log
        if: ${{ !cancelled() }}
        run: docker logs app

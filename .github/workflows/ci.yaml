name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Lint, types and schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --max-warnings 0
      - run: pnpm typecheck
      - run: pnpm exec prisma validate
      - run: pnpm exec prisma format --check

  smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORT: "3000"
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # start:prod creates and seeds the database, the same path a deploy takes.
      - name: Start the production server
        run: |
          pnpm start:prod > server.log 2>&1 &
          curl --silent --show-error --fail --output /dev/null \
            --retry 90 --retry-delay 1 --retry-all-errors "$BASE_URL/sign-in"
      - run: pnpm test:smoke
      - name: Server log
        if: ${{ !cancelled() }}
        run: cat server.log

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: satisfy-volunteer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Boots the image on an empty volume, as a first Coolify deploy would.
      - name: Boot the image
        run: |
          docker run --detach --name app --publish 3000:3000 --volume satisfy-data:/data satisfy-volunteer:ci
          curl --silent --show-error --fail --output /dev/null \
            --retry 120 --retry-delay 1 --retry-all-errors http://localhost:3000/sign-in
          test "$(docker inspect --format '{{.State.Running}}' app)" = true
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/)
          test "$status" = 307 || { echo "Expected / to redirect to sign-in, got $status"; exit 1; }
      - name: Container log
        if: ${{ !cancelled() }}
        run: docker logs app

# The web app is the root package. packages/core is shared with the native
# app, which lives in mobile/ as its own pnpm project (see mobile/README.md).
packages:
  - packages/*

# Mirrors the Fair Food layout: flat node_modules so Prisma's generated client
# and Next.js tracing behave like npm.
nodeLinker: hoisted
shamefullyHoist: true

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  better-sqlite3: true
  workerd: false

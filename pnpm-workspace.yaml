# Mirrors the Fair Food layout: flat node_modules so Prisma's generated client
# and Next.js tracing behave like npm.
nodeLinker: hoisted
shamefullyHoist: true

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: false
  # Pulled in by the Prisma CLI for its local `prisma dev` server; Postgres
  # never needs it, so its native build is skipped.
  better-sqlite3: false

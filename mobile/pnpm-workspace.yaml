# The native app is its own pnpm project, separate from the web workspace at
# the repo root. Expo SDK 57 pins react 19.2.3 while the web app is on a newer
# 19.2.x; one shared node_modules would load two copies of React.
# Flat node_modules keeps React Native autolinking and Metro simple.
nodeLinker: hoisted

allowBuilds:
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.30 || 57.0.31 || 57.0.32'
  - '@expo/prebuild-config@57.0.19'
  - expo-asset@57.0.20
  - expo-constants@57.0.22
  - expo-modules-autolinking@57.0.16
  - expo-modules-core@57.0.23 || 57.0.24
  - expo@57.0.29 || 57.0.30 || 57.0.31
  - '@expo/metro-runtime@57.0.17'
  - '@expo/ui@57.0.24 || 57.0.25 || 57.0.26'
  - expo-linking@57.0.13
  - expo-notifications@57.0.23 || 57.0.24
  - expo-router@57.0.27 || 57.0.28 || 57.0.29
  - '@expo/router-server@57.0.13 || 57.0.14'
  - babel-preset-expo@57.0.16
  - '@expo/config-plugins@57.0.11'
  - expo-modules-jsi@57.1.3

# react-native-screens reassigns every tab's appearance and icons whenever any
# tab changes, and iOS 26 re-measures the tab labels on each assignment, even of
# an equal value. On a cold start the session's badge counts arrive after the
# tab buttons exist but before the tab bar's first layout, so the labels were
# measured in zero-sized buttons and stayed clipped ("Trai...") and low until
# each tab was visited. The patch only assigns values that changed. Recheck it
# on every react-native-screens upgrade and drop it once upstream does the same
# (ios/tabs/RNSTabBarAppearanceCoordinator.mm).
patchedDependencies:
  react-native-screens@4.26.2: patches/react-native-screens@4.26.2.patch

# The native app is its own pnpm project, separate from the web workspace at
# the repo root. Expo SDK 58 pins react 19.3.0, which need not match the web
# app's React; one shared node_modules would load two copies of React.
# Flat node_modules keeps React Native autolinking and Metro simple.
nodeLinker: hoisted

allowBuilds:
  unrs-resolver: true

# Each patch is rechecked on every upgrade of its package and dropped once
# upstream does the same.
#
# react-native-screens reassigns every tab's appearance and icons whenever any
# tab changes, and iOS 26 re-measures the tab labels on each assignment, even of
# an equal value. On a cold start the session's badge counts arrive after the
# tab buttons exist but before the tab bar's first layout, so the labels were
# measured in zero-sized buttons and stayed clipped ("Trai...") and low until
# each tab was visited. The patch only assigns values that changed
# (ios/tabs/RNSTabBarAppearanceCoordinator.mm).
#
# masked-view's types extend React Native's NativeMethods, which React Native
# 0.87 removed, so TypeScript no longer accepts <MaskedView> as a component.
# The patch types it as a plain component; the native code is unchanged.
patchedDependencies:
  '@react-native-masked-view/masked-view@0.3.2': patches/@react-native-masked-view__masked-view@0.3.2.patch
  react-native-screens@4.30.1: patches/react-native-screens@4.30.1.patch
